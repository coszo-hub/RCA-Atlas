services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: graphrag
      POSTGRES_USER: graphrag_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      GRAPHRAG_API_DATABASE_PASSWORD: ${GRAPHRAG_API_DATABASE_PASSWORD:?set GRAPHRAG_API_DATABASE_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_initial.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./migrations/002_local_api_role.sql:/docker-entrypoint-initdb.d/002-api-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphrag_owner -d graphrag"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://graphrag_api_role:${GRAPHRAG_API_DATABASE_PASSWORD:?set GRAPHRAG_API_DATABASE_PASSWORD in .env}@db:5432/graphrag
      GRAPHRAG_API_KEY_SHA256: ${GRAPHRAG_API_KEY_SHA256:?set GRAPHRAG_API_KEY_SHA256 in .env}
      GRAPHRAG_STATEMENT_TIMEOUT_MS: "4000"
    ports: ["127.0.0.1:${GRAPHRAG_API_PORT:-8000}:8000"]
    depends_on:
      db: {condition: service_healthy}
  loader:
    profiles: ["load"]
    build: .
    environment:
      DATABASE_URL: postgresql://graphrag_owner:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/graphrag
    command: ["python", "load_postgres.py", "--dsn", "postgresql://graphrag_owner:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/graphrag", "--normalized", "/corpus/normalized", "--embeddings", "/corpus/embeddings", "--activate"]
    volumes:
      - ../../runtime_data/GraphRAG/normalized:/corpus/normalized:ro
      - ../../runtime_data/GraphRAG/embeddings:/corpus/embeddings:ro
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
