name = "rca-atlas"
main = "src/index.js"
compatibility_date = "2026-09-21"

# This is a public value, not a secret. Set ATLAS_API_ORIGIN to the HTTPS
# Cloudflare Tunnel URL after the private Graph-RAG API is tunnelled.
[vars]
ALLOWED_ORIGIN = "https://coszo.org"
ANSWER_MODEL = "gemini-2.5-flash"
# Auto's last resort, a paid OpenAI model on OPENAI_API_KEY, used only when the OOI model, Gemini and Groq all refuse
# (the free routes were all rate-limited at once on 2026-10-22, and visitors got no answer). Remove to keep Auto free.
AUTO_FALLBACK_OPENAI_MODEL = "gpt-5.4-mini"

# Secrets, never committed. Configure after deployment:
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put GROQ_API_KEY
#   wrangler secret put OPENAI_API_KEY
#   wrangler secret put ATLAS_API_KEY
#   wrangler secret put ATLAS_API_ORIGIN
# Optional, the OOI JupyterHub LLM through its relay (src/ooi_llm_relay); unset, the model is simply unavailable:
#   wrangler secret put OOI_RELAY_TOKEN
#   wrangler secret put OOI_RELAY_ORIGIN    # only for a quick tunnel (start.sh without a tunnel_token)
# Optional when Turnstile protection is added:
#   wrangler secret put TURNSTILE_SECRET

# The OOI LLM relay (src/ooi_llm_relay), reached through its named tunnel "ooi-llm-relay"
# (a1f09c54-f537-47df-8a28-5d30931f4771) with no public hostname. The VPC service "ooi-llm-relay" points at
# 127.0.0.1:8787 on the JupyterHub server that runs the tunnel.
[[vpc_services]]
binding = "OOI_RELAY"
service_id = "01a169d3-cc78-7b72-a336-31414354a57e"
